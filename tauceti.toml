# Canonical, human-owned project configuration. No credentials belong here.
schema_version = 1

[project]
name = "QPainleve"
branch = "main"
codeowners = ["@yuma-mizuno"]

[repositories]
content = "q-painleve-lean/QPainleve"
roadmap = "q-painleve-lean/QPainleveRoadmap"
# Upstream review engine and rubrics; [review] below selects the rubrics QPainleve runs.
review = "TauCetiProject/TauCetiReview"
# Enable and create these repositories when choosing the corresponding extras.
# data = "q-painleve-lean/QPainleveData"
# ci = "q-painleve-lean/QPainleveCI"
# claims = "q-painleve-lean/QPainleve-claims"

[lean]
roots = ["QPainleve"]
root_module = "empty"

[roadmap]
active_dir = "QPainleveRoadmap"
completed_dir = "Completed"

# Tau Ceti tooling, pinned to full commit SHAs. Tools runs from this org's fork: its `downstream`
# branch is upstream main plus the fixes listed in its DOWNSTREAM.md.
[tools.tools]
repo = "q-painleve-lean/TauCetiTools"
ref = "c29ec7f1efa50437562b88e448d94d5fd668db5f"
[tools.review]
repo = "TauCetiProject/TauCetiReview"
ref = "60472b78568d274587971787276e9009f957217c"
[tools.progress]
repo = "TauCetiProject/TauCetiProgress"
ref = "ddaaed27a70d9f376d300edf32d521843c27cc16"

# Workers submit finished PRs (`full_quality = true`); review checks only that the mathematics
# is right and well placed. Every listed rubric must be green on the head before auto-merge.
# Order matters: a block halts the round, so the block-capable angles run first.
[review]
rubrics = ["correctness", "reuse", "scope", "placement"]

[merge]
backend = "github-queue"
checks = ["build", "bump-guard", "scope"]

[[upstreams]]
repo = "leanprover-community/mathlib4"
package = "mathlib"
branch = "master"
# Mathlib is inherited through TauCeti; do not update it independently.
update = false
overlap = false
upstream_destination = false

# Nothing is sent upstream: TauCeti is only a dependency here.
[[upstreams]]
repo = "TauCetiProject/TauCeti"
package = "TauCeti"
cache_artifact_url = "https://cache.taucetiproject.org/artifacts"
cache_revision_url = "https://cache.taucetiproject.org/revisions"
branch = "main"
update = true
overlap = false
upstream_destination = false

# Everything below is optional. Use doctor --no-extras to report only core setup.
[features]
archives = false
ci_archive = false
claims = false
docs = false
progress = false
zulip = false
fleet = false
security_audit = false
roadmap_authoring = false

[services.github_state]
mode = "off"

[services.bors]
mode = "off"
deployment = "docker"

[services.cache]
# Main CI saves QPainleve's own outputs as one GitHub Actions cache bundle; PR, merge-queue
# and full-lint builds restore it. No cache service is involved (mode stays off).
ci_bundle = true
# No project cache yet: QPainleve modules build in CI and on workers.
# Mathlib and TauCeti use their upstream caches.
mode = "off"

[publication]
# docs_url = "https://q-painleve-lean.github.io/QPainleve/docs"
